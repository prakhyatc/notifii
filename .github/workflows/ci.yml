name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  notification_api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pytest
        run: pytest -q

      - name: Docker build
        run: docker build -t notifii-notification-api:ci .
