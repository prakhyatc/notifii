app = "notifii-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "services/email-worker/Dockerfile"

[env]
  QUEUE_BACKEND = "redis"
  EMAIL_PROVIDER = "console"
  IDEMPOTENCY_BACKEND = "redis"
  APP_ENV = "prod"
  POLL_WAIT_SECONDS = "5"
  MAX_BATCH = "10"

[processes]
  worker = ""
