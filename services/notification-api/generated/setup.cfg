[metadata]
name = openapi_server
version = 1.0.0
description = Notifii is a cloud-native notification platform providing a contract-first API for enqueueing email, SMS, and push notification requests. 
long_description = file: README.md
keywords = OpenAPI Notifii Notification API
python_requires = >= 3.7.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
