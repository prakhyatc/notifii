openapi: 3.0.3
info:
  title: Notifii Notification API
  description: |
    Notifii is a cloud-native notification platform providing a contract-first API
    for enqueueing email, SMS, and push notification requests.
  version: 1.0.0
  contact:
    name: Notifii Maintainers
    email: maintainer@example.com

servers:
  - url: http://localhost:8000
    description: Local dev
  - url: http://{host}
    description: Deployed (ALB DNS or custom domain)
    variables:
      host:
        default: example-alb-dns.amazonaws.com

tags:
  - name: Health
    description: Service health and readiness endpoints
  - name: Notifications
    description: Notification enqueueing endpoints

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the service process is running.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok

  /ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns 200 when the service is ready to accept traffic.
      operationId: getReady
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              examples:
                ready:
                  value:
                    status: ready
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notReady:
                  value:
                    error:
                      code: SERVICE_NOT_READY
                      message: Dependencies not initialized

  /v1/notifications:send:
    post:
      tags: [Notifications]
      summary: Enqueue a notification request
      description: |
        Accepts a notification request and enqueues it for asynchronous processing
        by the appropriate channel microservice.
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
            examples:
              emailExample:
                value:
                  channel: email
                  recipient: test@example.com
                  message: "Welcome to Notifii!"
                  idempotency_key: "8c1e7f8a-2f7f-4a4a-9f10-1e39c8d4d9d1"
              smsExample:
                value:
                  channel: sms
                  recipient: "+12145551234"
                  message: "Your code is 123456"
              pushExample:
                value:
                  channel: push
                  recipient: "device-token-or-user-id"
                  message: "You have a new alert"
      responses:
        "202":
          description: Accepted and queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNotificationResponse"
              examples:
                queued:
                  value:
                    message_id: "a5c7b5fe-4f65-4f1b-b8a6-6fd6c2d4f5a1"
                    status: queued

        "400":
          description: Validation error (malformed payload, missing fields, invalid enums)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidChannel:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: "Invalid 'channel' value"
                      details:
                        - field: channel
                          issue: "Must be one of: email, sms, push"

        "409":
          description: Idempotency conflict (request already processed with this idempotency key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idempotencyConflict:
                  value:
                    error:
                      code: IDEMPOTENCY_CONFLICT
                      message: "Request with this idempotency_key already exists"
                      details:
                        - field: idempotency_key
                          issue: "Duplicate key"

        "429":
          description: Rate limit exceeded (reserved for future)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rateLimited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: "Too many requests"

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverError:
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: "Unexpected error occurred"

components:
  schemas:
    Channel:
      type: string
      description: Notification delivery channel
      enum: [email, sms, push]

    SendNotificationRequest:
      type: object
      additionalProperties: false
      required: [channel, recipient, message]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        recipient:
          type: string
          minLength: 1
          description: Destination identifier (email address, phone number, device token, or user id)
        message:
          type: string
          minLength: 1
          maxLength: 5000
          description: Message body content
        idempotency_key:
          type: string
          description: |
            Optional idempotency key to safely retry requests without creating duplicates.
            Recommended to be a UUID.
          minLength: 1

    SendNotificationResponse:
      type: object
      additionalProperties: false
      required: [message_id, status]
      properties:
        message_id:
          type: string
          description: Unique identifier for the enqueued message
        status:
          type: string
          enum: [queued]
          description: Current enqueue status

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]

    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        issue:
          type: string

    ErrorObject:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"